<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Helix Command logo">
  <rect width="64" height="64" rx="15" fill="#12306b"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>
  <!-- antenna -->
  <path d="M32 21 V13" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="11" r="3.6" fill="#fff"/>
  <!-- head -->
  <rect x="14" y="21" width="36" height="28" rx="10" fill="#fff"/>
  <rect x="9.5" y="29" width="4.5" height="13" rx="2.2" fill="#fff"/>
  <rect x="50" y="29" width="4.5" height="13" rx="2.2" fill="#fff"/>
  <!-- visor -->
  <rect x="19" y="28" width="26" height="11" rx="5.5" fill="#12306b"/>
  <circle cx="27" cy="33.5" r="2.8" fill="#fff"/>
  <circle cx="37" cy="33.5" r="2.8" fill="#fff"/>
  <!-- helix: two crossing strands as the "mouth" -->
  <path d="M22 44.5 C26 41.5 29 47.5 32 44.5 S38 41.5 42 44.5" fill="none" stroke="#12306b" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 44.5 C26 47.5 29 41.5 32 44.5 S38 47.5 42 44.5" fill="none" stroke="#12306b" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
</svg>
