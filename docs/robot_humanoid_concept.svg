<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-label="Helix human-shaped rescue robot concept walking while carrying a casualty in its arms">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8AA0B6"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1722"/><stop offset="1" stop-color="#0B1118"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2D42"/><stop offset="1" stop-color="#26405C"/></linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="700" y="52" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#E6EEF7">Helix rescue robot: vision</text>
  <text x="700" y="84" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Human-shaped, human-height, walks and carries.</text>
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Concept illustration, not a CAD model.</text>
  <line x1="48" y1="740" x2="1232" y2="740" stroke="#223244" stroke-width="3"/>

  <!-- back leg -->
  <line x1="545" y1="425" x2="500" y2="565" stroke="#3A4A5A" stroke-width="40" stroke-linecap="round"/>
  <line x1="500" y1="565" x2="450" y2="705" stroke="#3A4A5A" stroke-width="32" stroke-linecap="round"/>
  <path d="M440 712 L488 700 L492 728 L426 732 Z" fill="#3A4A5A" stroke="#5D6D7E" stroke-width="2"/>
  <circle cx="500" cy="565" r="15" fill="#6B5A2E"/>

  <!-- backpack -->
  <rect x="468" y="238" width="30" height="150" rx="8" fill="#2A2412" stroke="#FFB454" stroke-width="2"/>

  <!-- torso -->
  <rect x="500" y="226" width="124" height="204" rx="26" fill="url(#body)" stroke="#35D0E6" stroke-width="3"/>
  <rect x="596" y="256" width="26" height="80" rx="8" fill="#0B1118" stroke="#4CD694" stroke-width="3"/>
  <line x1="601" y1="272" x2="617" y2="272" stroke="#4CD694" stroke-width="3"/>
  <line x1="601" y1="290" x2="617" y2="290" stroke="#4CD694" stroke-width="3"/>
  <line x1="601" y1="308" x2="617" y2="308" stroke="#4CD694" stroke-width="3"/>
  <text x="552" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#E6EEF7">HELIX</text>

  <!-- neck + head -->
  <rect x="546" y="204" width="28" height="26" rx="6" fill="#26405C" stroke="#8AA0B6" stroke-width="2"/>
  <circle cx="560" cy="170" r="38" fill="url(#body)" stroke="#35D0E6" stroke-width="3"/>
  <rect x="566" y="157" width="40" height="24" rx="11" fill="#0B1118" stroke="#FFB454" stroke-width="3"/>
  <circle cx="588" cy="169" r="6" fill="#FFB454"/>

  <!-- front leg -->
  <line x1="580" y1="425" x2="622" y2="565" stroke="#8AA0B6" stroke-width="42" stroke-linecap="round"/>
  <line x1="622" y1="565" x2="668" y2="705" stroke="#8AA0B6" stroke-width="34" stroke-linecap="round"/>
  <path d="M652 702 L718 706 L722 732 L660 734 Z" fill="#8AA0B6" stroke="#E6EEF7" stroke-width="2"/>
  <circle cx="622" cy="565" r="16" fill="#FFB454"/>
  <circle cx="580" cy="425" r="17" fill="#FFB454"/>

  <!-- far arm -->
  <line x1="606" y1="262" x2="676" y2="330" stroke="#3A4A5A" stroke-width="22" stroke-linecap="round"/>
  <line x1="676" y1="330" x2="880" y2="330" stroke="#3A4A5A" stroke-width="20" stroke-linecap="round"/>

  <!-- casualty -->
  <rect x="660" y="278" width="330" height="40" rx="20" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <circle cx="1010" cy="298" r="24" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <rect x="660" y="272" width="330" height="14" rx="7" fill="#2E6B8A" opacity="0.85"/>

  <!-- near arm -->
  <line x1="618" y1="258" x2="690" y2="326" stroke="#8AA0B6" stroke-width="26" stroke-linecap="round"/>
  <line x1="690" y1="326" x2="900" y2="326" stroke="#8AA0B6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="618" cy="258" r="18" fill="#FFB454"/>
  <circle cx="690" cy="326" r="15" fill="#FFB454"/>
  <circle cx="900" cy="326" r="12" fill="#E6EEF7"/>

  <!-- motion cue -->
  <g stroke="#35D0E6" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="330" y1="610" x2="380" y2="610"/><line x1="300" y1="650" x2="370" y2="650"/><line x1="340" y1="690" x2="400" y2="690"/>
  </g>

  <!-- height dimension -->
  <line x1="236" y1="138" x2="236" y2="740" stroke="#8AA0B6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="222" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#E6EEF7" transform="rotate(-90 222 440)">about 1.5 m (5 ft), human height</text>

  <!-- callouts -->
  <g font-family="Arial, sans-serif" font-size="20" fill="#E6EEF7">
    <line x1="520" y1="150" x2="400" y2="130" stroke="#8AA0B6"/><text x="270" y="128">Thermal camera, mic array</text>
    <line x1="624" y1="300" x2="700" y2="448" stroke="#8AA0B6"/><text x="706" y="456">Radar and CO₂ sensing on the chest</text>
    <line x1="880" y1="334" x2="930" y2="372" stroke="#8AA0B6"/><text x="936" y="378">Arms with torque limits</text><text x="936" y="404">and load sensing</text>
    <line x1="470" y1="330" x2="410" y2="390" stroke="#8AA0B6"/><text x="252" y="406">Back-mounted power</text>
    <line x1="650" y1="600" x2="716" y2="606" stroke="#8AA0B6"/><text x="722" y="606">Legs for walking</text><text x="722" y="632">at human pace</text>
  </g>

  <!-- design targets -->
  <rect x="900" y="480" width="332" height="190" rx="16" fill="#121B26" stroke="#223244" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#E6EEF7">
    <text x="922" y="516" font-size="22" font-weight="700" fill="#35D0E6">Design targets</text>
    <text x="922" y="548" font-size="19">Walk at human pace (about 5 km/h)</text>
    <text x="922" y="576" font-size="19">Carry a casualty up to ~90 kg</text>
    <text x="922" y="604" font-size="19">Human height and reach</text>
    <text x="922" y="640" font-size="18" fill="#8AA0B6">A long-term vision. Today: the decision</text>
    <text x="922" y="662" font-size="18" fill="#8AA0B6">layer, proven in simulation.</text>
  </g>
</svg>
