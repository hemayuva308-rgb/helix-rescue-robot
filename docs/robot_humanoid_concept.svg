<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-label="Helix human-height rescue robot concept carrying a casualty in its arms">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8AA0B6"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1722"/><stop offset="1" stop-color="#0B1118"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2D42"/><stop offset="1" stop-color="#26405C"/></linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="700" y="52" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#E6EEF7">Helix rescue robot: concept</text>
  <text x="700" y="84" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Human-height, human-shaped upper body on a tracked base.</text>
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Concept illustration, not a CAD model.</text>

  <line x1="48" y1="740" x2="1232" y2="740" stroke="#223244" stroke-width="3"/>

  <!-- outriggers (deployed during a lift) -->
  <g stroke="#FFB454" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14">
    <line x1="500" y1="610" x2="300" y2="736"/>
    <line x1="640" y1="610" x2="850" y2="736"/>
  </g>
  <rect x="270" y="732" width="60" height="10" rx="4" fill="#FFB454"/>
  <rect x="820" y="732" width="60" height="10" rx="4" fill="#FFB454"/>

  <!-- tracks -->
  <rect x="340" y="640" width="440" height="100" rx="46" fill="#1B2733" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="386" cy="690" r="30" fill="none" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="734" cy="690" r="30" fill="none" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="480" cy="708" r="13" fill="none" stroke="#3A4A5A" stroke-width="2"/>
  <circle cx="560" cy="708" r="13" fill="none" stroke="#3A4A5A" stroke-width="2"/>
  <circle cx="640" cy="708" r="13" fill="none" stroke="#3A4A5A" stroke-width="2"/>

  <!-- waist column -->
  <rect x="490" y="400" width="140" height="244" rx="14" fill="url(#body)" stroke="#35D0E6" stroke-width="3"/>
  <rect x="506" y="560" width="108" height="64" rx="8" fill="#12533A" stroke="#4CD694" stroke-width="2"/>
  <text x="560" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E6EEF7">battery</text>

  <!-- back pack -->
  <rect x="446" y="186" width="30" height="170" rx="8" fill="#2A2412" stroke="#FFB454" stroke-width="2"/>

  <!-- torso -->
  <rect x="470" y="160" width="180" height="244" rx="26" fill="url(#body)" stroke="#35D0E6" stroke-width="3"/>
  <rect x="606" y="196" width="30" height="90" rx="8" fill="#0B1118" stroke="#4CD694" stroke-width="3"/>
  <line x1="612" y1="214" x2="630" y2="214" stroke="#4CD694" stroke-width="3"/>
  <line x1="612" y1="232" x2="630" y2="232" stroke="#4CD694" stroke-width="3"/>
  <line x1="612" y1="250" x2="630" y2="250" stroke="#4CD694" stroke-width="3"/>
  <text x="560" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#E6EEF7">HELIX</text>

  <!-- neck + head -->
  <rect x="545" y="138" width="30" height="26" rx="6" fill="#26405C" stroke="#8AA0B6" stroke-width="2"/>
  <circle cx="560" cy="104" r="44" fill="url(#body)" stroke="#35D0E6" stroke-width="3"/>
  <rect x="566" y="90" width="46" height="26" rx="12" fill="#0B1118" stroke="#FFB454" stroke-width="3"/>
  <circle cx="590" cy="103" r="7" fill="#FFB454"/>

  <!-- far arm (behind) -->
  <line x1="628" y1="210" x2="706" y2="282" stroke="#3A4A5A" stroke-width="22" stroke-linecap="round"/>
  <line x1="706" y1="282" x2="900" y2="282" stroke="#3A4A5A" stroke-width="20" stroke-linecap="round"/>

  <!-- casualty -->
  <rect x="690" y="228" width="340" height="40" rx="20" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <circle cx="1050" cy="248" r="24" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <rect x="690" y="222" width="340" height="14" rx="7" fill="#2E6B8A" opacity="0.85"/>

  <!-- near arm -->
  <line x1="640" y1="204" x2="722" y2="276" stroke="#8AA0B6" stroke-width="26" stroke-linecap="round"/>
  <line x1="722" y1="276" x2="930" y2="276" stroke="#8AA0B6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="640" cy="204" r="18" fill="#FFB454"/>
  <circle cx="722" cy="276" r="15" fill="#FFB454"/>
  <circle cx="930" cy="276" r="12" fill="#E6EEF7"/>

  <!-- dimension: height -->
  <line x1="236" y1="60" x2="236" y2="740" stroke="#8AA0B6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="222" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#E6EEF7" transform="rotate(-90 222 410)">about 1.5 m (5 ft), human height</text>

  <!-- callouts -->
  <g font-family="Arial, sans-serif" font-size="20" fill="#E6EEF7">
    <line x1="520" y1="82" x2="400" y2="60" stroke="#8AA0B6"/><text x="270" y="58">Thermal camera, mic array</text>
    <line x1="630" y1="262" x2="700" y2="384" stroke="#8AA0B6"/><text x="706" y="392">Radar and CO₂ sensing on the chest</text>
    <line x1="900" y1="288" x2="940" y2="326" stroke="#8AA0B6"/><text x="946" y="332">Arms with torque limits</text><text x="946" y="358">and load sensing</text>
    <line x1="450" y1="330" x2="400" y2="402" stroke="#8AA0B6"/><text x="252" y="418">Back-mounted power</text>
    <line x1="850" y1="736" x2="930" y2="700" stroke="#8AA0B6"/><text x="936" y="704">Outriggers deploy during a lift</text>
    <line x1="780" y1="690" x2="930" y2="650" stroke="#8AA0B6"/><text x="936" y="654">Tracked base for stability</text>
  </g>

  <!-- spec panel -->
  <rect x="930" y="470" width="302" height="150" rx="16" fill="#121B26" stroke="#223244" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#E6EEF7">
    <text x="952" y="506" font-size="22" font-weight="700" fill="#35D0E6">Design targets</text>
    <text x="952" y="538" font-size="19">Payload 100 kg, casualty to ~90 kg</text>
    <text x="952" y="566" font-size="19">Carries the casualty in its arms</text>
    <text x="952" y="594" font-size="19" fill="#8AA0B6">Walking biped version: future work</text>
  </g>
</svg>
