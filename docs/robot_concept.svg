<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-label="Helix rescue unit concept: tracked base, 1.7 m sensor mast, lift arm and stretcher">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8AA0B6"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1722"/><stop offset="1" stop-color="#0B1118"/></linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="470" y="56" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#E6EEF7">Helix rescue unit: concept</text>
  <text x="470" y="88" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Side view. Concept illustration, not a CAD model.</text><text x="470" y="114" font-family="Arial, sans-serif" font-size="20" fill="#8AA0B6">Dimensions are first-pass design assumptions.</text>

  <!-- ground -->
  <line x1="48" y1="740" x2="860" y2="740" stroke="#223244" stroke-width="3"/>

  <!-- tracks -->
  <rect x="300" y="640" width="480" height="100" rx="46" fill="#1B2733" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="346" cy="690" r="30" fill="none" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="734" cy="690" r="30" fill="none" stroke="#5D6D7E" stroke-width="3"/>
  <circle cx="440" cy="708" r="14" fill="none" stroke="#3A4A5A" stroke-width="2"/>
  <circle cx="540" cy="708" r="14" fill="none" stroke="#3A4A5A" stroke-width="2"/>
  <circle cx="640" cy="708" r="14" fill="none" stroke="#3A4A5A" stroke-width="2"/>

  <!-- chassis -->
  <rect x="318" y="580" width="446" height="76" rx="10" fill="#16324A" stroke="#35D0E6" stroke-width="3"/>
  <rect x="338" y="598" width="150" height="40" rx="6" fill="#12533A" stroke="#4CD694" stroke-width="2"/>
  <text x="413" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E6EEF7">battery (low)</text>
  <rect x="506" y="598" width="120" height="40" rx="6" fill="#2A2412" stroke="#FFB454" stroke-width="2"/>
  <text x="566" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E6EEF7">compute</text>
  <rect x="640" y="598" width="104" height="40" rx="6" fill="#16324A" stroke="#35D0E6" stroke-width="2"/>
  <text x="692" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E6EEF7">sealed gen.</text>

  <!-- mast -->
  <rect x="336" y="100" width="48" height="480" rx="8" fill="#1B2733" stroke="#8AA0B6" stroke-width="3"/>
  <rect x="296" y="60" width="128" height="62" rx="10" fill="#16324A" stroke="#35D0E6" stroke-width="3"/>
  <circle cx="330" cy="91" r="14" fill="#0B1118" stroke="#FFB454" stroke-width="3"/>
  <circle cx="378" cy="91" r="14" fill="#0B1118" stroke="#35D0E6" stroke-width="3"/>
  <rect x="396" y="78" width="16" height="26" rx="4" fill="#4CD694"/>

  <!-- lift arm -->
  <line x1="700" y1="590" x2="640" y2="440" stroke="#8AA0B6" stroke-width="14" stroke-linecap="round"/>
  <line x1="740" y1="590" x2="800" y2="440" stroke="#8AA0B6" stroke-width="14" stroke-linecap="round"/>
  <circle cx="720" cy="578" r="13" fill="#FFB454"/>

  <!-- stretcher + casualty -->
  <rect x="470" y="420" width="420" height="22" rx="6" fill="#2A3D50" stroke="#E6EEF7" stroke-width="3"/>
  <rect x="500" y="384" width="330" height="36" rx="18" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <circle cx="860" cy="402" r="22" fill="#7A3552" stroke="#FF5FA2" stroke-width="3"/>
  <rect x="500" y="378" width="330" height="14" rx="7" fill="#2E6B8A" opacity="0.85"/>
  <text x="660" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E6EEF7">casualty, covered with a thermal blanket</text>

  <!-- dimension: height -->
  <line x1="236" y1="60" x2="236" y2="740" stroke="#8AA0B6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="222" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#E6EEF7" transform="rotate(-90 222 410)">about 1.7 m</text>
  <!-- dimension: length -->
  <line x1="300" y1="772" x2="780" y2="772" stroke="#8AA0B6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="540" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#E6EEF7">1.2 m</text>

  <!-- callouts -->
  <g font-family="Arial, sans-serif" font-size="20" fill="#E6EEF7">
    <line x1="412" y1="112" x2="500" y2="196" stroke="#8AA0B6"/><text x="506" y="202">Thermal camera, mic array, radar</text>
    <line x1="384" y1="260" x2="560" y2="250" stroke="#8AA0B6"/><text x="566" y="256">Sensor mast with CO₂ and IMU</text>
    <line x1="800" y1="440" x2="900" y2="520" stroke="#8AA0B6"/><text x="906" y="526">Lift arm with torque limits</text>
    <line x1="890" y1="440" x2="930" y2="470" stroke="#8AA0B6"/><text x="936" y="476">Stretcher with load cell</text>
    <text x="820" y="700">Low, wide tracks for stability</text><line x1="780" y1="690" x2="812" y2="696" stroke="#8AA0B6"/>
  </g>

  <!-- spec panel -->
  <rect x="930" y="150" width="302" height="300" rx="16" fill="#121B26" stroke="#223244" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#E6EEF7">
    <text x="952" y="190" font-size="24" font-weight="700" fill="#35D0E6">Key numbers</text>
    <text x="952" y="228" font-size="20">Payload 100 kg incl. stretcher</text>
    <text x="952" y="258" font-size="20">Casualty up to about 90 kg</text>
    <text x="952" y="288" font-size="20">Mass about 259 kg empty</text>
    <text x="952" y="318" font-size="20">Centre of gravity about 0.5 m</text>
    <text x="952" y="348" font-size="20">Static tip angle about 42°</text>
    <text x="952" y="378" font-size="20" fill="#8AA0B6">(90 kg casualty, flat ground)</text>
    <text x="952" y="418" font-size="18" fill="#8AA0B6">All values are design assumptions.</text>
  </g>
</svg>
